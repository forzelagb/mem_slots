<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Инвентарь</title>
  <link rel="stylesheet" href="inventory.css">
</head>
<body>
  <div id="inventory-v4-screen" class="screen">
    <div class="inventory-v4">
      <aside class="inventory-v4-sidebar">
        <button class="inventory-v4-btn active" onclick="openInventoryV4Tab('chests')">🎁 Сундуки</button>
        <button class="inventory-v4-btn" onclick="openInventoryV4Tab('cloth')">🧵 Ткани</button>
        <button class="inventory-v4-btn" onclick="openInventoryV4Tab('resources')">💎 Ресурсы</button>
        <button class="inventory-v4-btn" onclick="openInventoryV4Tab('fragments')">🧩 Фрагменты</button>
      </aside>

      <main class="inventory-v4-main">
        <h1 id="inventory-v4-title">СУНДУКИ</h1>
        <p id="inventory-v4-subtitle">Открывай сундуки и получай награды</p>

        <div id="chests" class="inventory-v4-tab active">
          <div class="inventory-v4-grid"></div>
        </div>
        <div id="cloth" class="inventory-v4-tab">
          <div class="inventory-v4-grid" id="inventory-v4-cloth-grid"></div>
        </div>
        <div id="resources" class="inventory-v4-tab">
          <div class="inventory-v4-grid" id="inventory-v4-resources-grid"></div>
        </div>
        <div id="fragments" class="inventory-v4-tab">
          <div class="inventory-v4-grid" id="inventory-v4-fragments-grid"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="inventory.js"></script>
</body>
</html>
