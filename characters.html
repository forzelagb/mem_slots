<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Персонажи</title>
  <link rel="stylesheet" href="characters.css">
</head>
<body>

<header class="gl-topbar">

    <div class="gl-player">

        <div class="gl-player-avatar">
            <img src="./image/ui/gl/card-lexapaws.png" alt="">
        </div>

        <div class="gl-player-info">

            <div class="gl-player-name">PLAYER</div>

            <div class="gl-player-role">
                Коллекционер
            </div>

            <div class="gl-player-xp-row">

                <span>32</span>

                <div class="gl-player-xp">
                    <div style="width:55%;"></div>
                </div>

                <small>2450 / 5000 XP</small>

            </div>

        </div>

    </div>

    <div class="gl-resources">

        <div class="gl-resource">
            🪙 <span>12500</span> <b>+</b>
        </div>

        <div class="gl-resource">
            💎 <span>2150</span> <b>+</b>
        </div>

        <div class="gl-resource">
            ⚡ <span>100</span> <b>+</b>
        </div>

        <button class="gl-bell">🔔</button>

    </div>

</header>

  <main class="characters-page">

    <section class="info-panel">
      <h1 id="charName">HELIN</h1>
      <span class="rarity">ЭПИЧЕСКИЙ</span>

      <p class="status">СТАТУС: <span id="charStatus">ОТКРЫТ</span></p>

      <p class="desc" id="charDesc">
        Харизматичный и уверенный в себе герой. Его удача помогает получать лучшие награды.
      </p>

      <h3>ХАРАКТЕРИСТИКИ</h3>

      <div class="stat">❤️ Здоровье <b id="hp">820</b></div>
      <div class="stat">⚔️ Атака <b id="attack">110</b></div>
      <div class="stat">🛡️ Защита <b id="defense">85</b></div>

      <h3>СПОСОБНОСТЬ</h3>

      <div class="ability">
        <b id="abilityName">УДАЧА</b>
        <p id="abilityText">Повышает шанс редких наград на 8%.</p>
      </div>
    </section>

    <section class="stage">
      <img id="charImage" src="image/characters/helin/preview.png" alt="Персонаж">

      <button id="mainBtn" class="main-btn">
        ПРИМЕНИТЬ ПЕРСОНАЖА
      </button>
    </section>

<section class="right-buttons">
  <img class="action-btn style-btn" src="image/ui/person/style.png" alt="Стили">
  <img class="action-btn up-btn" src="image/ui/person/up.png" alt="Прокачка">
  <img class="action-btn history-btn" src="image/ui/person/dsf.png" alt="История">
</section>

    <section class="bottom-carousel">
<button id="prevBtn" class="bg-arrow bg-arrow-left"></button>

<div id="cards" class="cards"></div>

<button id="nextBtn" class="bg-arrow bg-arrow-right"></button>
    </section>

  </main>

  <script src="characters.js"></script>
</body>
</html>
