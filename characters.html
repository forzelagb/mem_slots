<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Персонажи</title>
  <link rel="stylesheet" href="characters.css">
</head>
<body>

<header class="game-topbar">
    <div class="game-user">
        <div class="game-avatar js-player-letter">P</div>

        <div>
            <div class="game-name js-player-name">PLAYER</div>
            <div class="game-role">
                Коллекционер • Ур. <span class="js-level">1</span>
            </div>
        </div>
    </div>

    <div class="game-resources">
        <div class="game-resource-item">
            <img src="image/ui/gold.png" alt="">
            <span class="js-gold">0</span>
        </div>

        <div class="game-resource-item">
            <img src="image/ui/gems.png" alt="">
            <span class="js-gems">0</span>
        </div>

        <div class="game-resource-item">
            <img src="image/ui/energy.png" alt="">
            <span class="js-energy">0/100</span>
        </div>
    </div>
</header>

  <main class="characters-page">

    <section class="info-panel">
      <h1 id="charName">HELIN</h1>
      <span class="rarity">ЭПИЧЕСКИЙ</span>

      <p class="status">СТАТУС: <span id="charStatus">ОТКРЫТ</span></p>

      <p class="desc" id="charDesc">
        Харизматичный и уверенный в себе герой. Его удача помогает получать лучшие награды.
      </p>

      <h3>ХАРАКТЕРИСТИКИ</h3>

      <div class="stat">❤️ Здоровье <b id="hp">820</b></div>
      <div class="stat">⚔️ Атака <b id="attack">110</b></div>
      <div class="stat">🛡️ Защита <b id="defense">85</b></div>
    </section>

    <section class="stage">
      <img id="charImage" src="image/characters/helin/preview.png" alt="Персонаж">

      <button id="mainBtn" class="main-btn">
        ПРИМЕНИТЬ ПЕРСОНАЖА
      </button>
    </section>

<section class="right-buttons">
  <img class="style-btn"
     src="image/ui/person/style.png"
     onclick="openSoonModal()">
  <img class="up-btn"
     src="image/ui/person/up.png"
     onclick="openSoonModal()">
  <img class="action-btn history-btn"
     src="image/ui/person/dsf.png"
     alt="История"
     onclick="openStoryModal()">
</section>

    <section class="bottom-carousel">
<button id="prevBtn" class="bg-arrow bg-arrow-left"></button>

<div id="cards" class="cards"></div>

<button id="nextBtn" class="bg-arrow bg-arrow-right"></button>
    </section>

  </main>
<div id="storyModal" class="story-modal" onclick="closeStoryModal()">

    <div class="story-wrapper" onclick="event.stopPropagation()">

        <img src="image/ui/person/story-modal.png" alt="История персонажей">

        <a
            class="story-submit-zone"
            href="https://docs.google.com/forms/d/e/1FAIpQLSfcPAkhl7KVGgLIYZanfj_ErqnTXwqiAG2CEN3lT8r8HpG2eQ/viewform?usp=publish-editor"
            target="_blank">
        </a>

    </div>

</div>
<div id="soonModal" class="soon-modal">
    <div class="soon-content">

        <button class="soon-close" onclick="closeSoonModal()">
            ✕
        </button>

        <img src="image/ui/gl/do_it.png" alt="Скоро" />

    </div>
</div>
<script src="script.js"></script>
  <script src="characters.js"></script>
</body>
</html>
