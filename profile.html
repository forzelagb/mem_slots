<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="profile-page">

    <div class="profile-main-image">
        <img src="image/ui/profile/profile-bg.png" alt="Профиль">
        <div id="profileNickname" class="profile-nickname">PLAYER</div>
        <div id="profileLetter" class="profile-letter">P</div>
        <div id="profileLevel" class="profile-level">1</div>

<div class="profile-xp-bar">
    <div id="profileXpFill" class="profile-xp-fill"></div>
</div>

<div id="profileXpText" class="profile-xp-text">0 / 500 XP</div>
        <div id="profileRolls" class="profile-stat-number profile-rolls">0</div>
<div id="profileCards" class="profile-stat-number profile-cards">0</div>
<div id="profileEnergy" class="profile-stat-number profile-energy">0</div>
<div id="profilePacks" class="profile-stat-number profile-packs">0</div>
<img id="profileCharacterImg" class="profile-character-img" src="image/characters/lexapaws/preview.png" alt="Персонаж">

        <div class="profile-buttons-on-image">
            <img src="image/ui/profile/btn-change-name.png" alt="Изменить ник" onclick="openChangeNameModal()">
            <img src="image/ui/profile/btn-change-character.png" alt="Сменить персонажа" onclick="openCharacterModal()">
        </div>
    </div>
<div id="changeNameModal" class="change-name-modal">
    <img src="image/ui/profile/change.png" alt="Смена ника">

    <input id="nicknameInput" class="nickname-input" maxlength="14" placeholder="">

    <div id="nicknameCounter" class="nickname-counter">0/14</div>

    <button class="nickname-close" onclick="closeChangeNameModal()"></button>
    <button class="nickname-cancel" onclick="closeChangeNameModal()"></button>
    <button class="nickname-save" onclick="saveProfileNickname()"></button>
</div>
<div id="characterModal" class="character-modal">
    <div class="character-modal-content">
        <img class="character-modal-bg" src="image/ui/profile/take.png" alt="Выбор персонажа">

        <img id="characterModalPreview" class="character-modal-preview" src="image/characters/helin/preview.png" alt="Персонаж">

        <button class="character-arrow character-left" onclick="prevCharacter()"></button>
        <button class="character-arrow character-right" onclick="nextCharacter()"></button>
        <button class="character-select-btn" onclick="selectCurrentCharacter()"></button>
    </div>
</div>
</section>
<button id="logoutProfileBtn" class="profile-logout-btn">
    <img src="image/ui/gl/back.png" alt="Выйти из профиля">
</button>
<button onclick="window.location.href='index.html'" class="profile-home-btn">
    Главная
</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>
</body>
</html>
