<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="profile-page">

    <div class="profile-header">
        <div class="profile-avatar"></div>

        <div class="profile-header-text">
            Получай опыт за каждое достижение и повышай уровень
        </div>
    </div>

    <div class="profile-section">
        <h2>МОЯ СТАТИСТИКА</h2>

        <div class="stats-grid">
            <div class="stat-card">
                <img src="image/ui/profile/icon-rolls.png">
                <p>Запусков</p>
            </div>

            <div class="stat-card">
                <img src="image/ui/profile/icon-cards.png">
                <p>Карточек найдено</p>
            </div>

            <div class="stat-card">
                <img src="image/ui/profile/icon-energy.png">
                <p>Потрачено энергии</p>
            </div>

            <div class="stat-card">
                <img src="image/ui/profile/icon-packs.png">
                <p>Открыто паков</p>
            </div>
        </div>
    </div>

    <div class="profile-row">
        <div class="profile-box">
            <h2>ТЕКУЩИЙ ПЕРСОНАЖ</h2>
            <div class="profile-empty-box"></div>
        </div>

        <div class="profile-box">
            <h2>ВИТРИНА ПРОФИЛЯ</h2>
            <div class="profile-achievements-placeholder">
                Скоро здесь появятся твои достижения
            </div>
        </div>
    </div>

    <div class="profile-section">
        <h2>НАСТРОЙКИ ПРОФИЛЯ</h2>

        <div class="settings-buttons">
            <img src="image/ui/profile/btn-change-name.png" alt="Изменить ник">
            <img src="image/ui/profile/btn-change-character.png" alt="Сменить персонажа">
        </div>
    </div>

</section>

<script src="script.js"></script>
</body>
</html>
