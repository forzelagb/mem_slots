<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="profile-page">

<div class="profile-main-image">
    <img src="image/ui/profile/profile-bg.png" alt="Профиль">
</div>

    <div class="profile-section">
        <h2>МОЯ СТАТИСТИКА</h2>

        <div class="stats-grid">
            <div class="stat-card">
                <p>Запусков</p>
            </div>

            <div class="stat-card">
                <p>Карточек найдено</p>
            </div>

            <div class="stat-card">
                <p>Потрачено энергии</p>
            </div>

            <div class="stat-card">
                <p>Открыто паков</p>
            </div>
        </div>
    </div>

    <div class="profile-row">
        <div class="profile-box">
            <h2>ТЕКУЩИЙ ПЕРСОНАЖ</h2>
            <div class="profile-empty-box"></div>
        </div>

        <div class="profile-box">
            <h2>ВИТРИНА ПРОФИЛЯ</h2>
            <div class="profile-achievements-placeholder">
                Скоро здесь появятся твои достижения
            </div>
        </div>
    </div>

    <div class="profile-section">
        <h2>НАСТРОЙКИ ПРОФИЛЯ</h2>

        <div class="settings-buttons">
            <img src="image/ui/profile/btn-change-name.png" alt="Изменить ник">
            <img src="image/ui/profile/btn-change-character.png" alt="Сменить персонажа">
        </div>
    </div>

</section>

<script src="script.js"></script>
</body>
</html>
