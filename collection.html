<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллекции</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
</head>
<body class="collection-page">

    <header class="collection-header">
        <div class="collection-logo">
            <img src="image/ui/gl/logo-main.png" alt="Meme Collection Club">
        </div>

        <div class="collection-header-resources">
            <div class="collection-resource">⚡ <span>100/100</span> <b>+</b></div>
            <div class="collection-resource">🪙 <span>12500</span> <b>+</b></div>
            <div class="collection-resource">💎 <span>2150</span> <b>+</b></div>
        </div>
    </header>

    <a href="index.html" class="collection-home-btn">
        🏠 <span>Главная</span>
    </a>

    <main class="collection-main">
        <div class="collection-title-row">
            <div>
                <h1>КОЛЛЕКЦИИ</h1>
                <p>Собирай карточки любимых стримеров и получай награды</p>
            </div>

            <div class="collection-filters">
                <button class="collection-filter-btn active" onclick="renderCollectionCards('all')">
                    Все
                </button>

                <button class="collection-filter-btn" onclick="renderCollectionCards('progress')">
                    По прогрессу
                </button>
            </div>
        </div>

        <div id="collectionCardsGrid" class="collection-cards-grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
