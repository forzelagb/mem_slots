<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллекции</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
</head>
<body class="collection-page">

<header class="game-topbar">
    <div class="game-user">
        <div class="game-avatar js-player-letter">P</div>

        <div>
            <div class="game-name js-player-name">PLAYER</div>
            <div class="game-role">
                Коллекционер • Ур. <span class="js-level">1</span>
            </div>
        </div>
    </div>

    <div class="game-resources">
        <div class="game-resource-item">
            <img src="image/ui/gold.png" alt="">
            <span class="js-gold">0</span>
        </div>

        <div class="game-resource-item">
            <img src="image/ui/gems.png" alt="">
            <span class="js-gems">0</span>
        </div>
    </div>
</header>

    <a href="index.html" class="collection-home-btn">
        🏠 <span>Главная</span>
    </a>

    <main class="collection-main">
        <div class="collection-title-row">
            <div>
                <h1>КОЛЛЕКЦИИ</h1>
                <p>Собирай карточки любимых стримеров и получай награды</p>
            </div>

            <div class="collection-filters">
                <button class="collection-filter-btn active" onclick="renderCollectionCards('all')">
                    Все
                </button>

                <button class="collection-filter-btn" onclick="renderCollectionCards('progress')">
                    По прогрессу
                </button>
            </div>
        </div>

        <div id="collectionCardsGrid" class="collection-cards-grid"></div>
    </main>
<div id="collectionModal" class="collection-modal">

    <div class="collection-modal-window">

        <button class="collection-modal-close"
                onclick="closeCollectionModal()">
            ✕
        </button>

        <div class="collection-modal-left">

            <img id="collectionModalImage"
                 src=""
                 alt="">

            <div class="collection-modal-progress">

                <span>Общий прогресс</span>

                <b id="collectionModalProgress">
                    0%
                </b>

            </div>

            <div class="collection-progress-bar">
                <div id="collectionModalProgressFill"
                     class="collection-progress-fill">
                </div>
            </div>

        </div>

        <div class="collection-modal-right">

            <div class="collection-modal-tabs">

<button id="collectionCardsBtn" class="collection-modal-tab active" onclick="showCollectionTab('cards')">
    Карточки
</button>

<button id="collectionRewardsBtn" class="collection-modal-tab" onclick="showCollectionTab('rewards')">
    Награды
</button>

            </div>

            <h2 id="collectionModalTitle">
                HELIN
            </h2>

<div id="collectionCardsTab" class="collection-rarity-grid">

                <div class="rarity-card common">
                    <h3>COMMON</h3>
                    <span>0%</span>
                </div>

                <div class="rarity-card rare">
                    <h3>RARE</h3>
                    <span>0%</span>
                </div>

                <div class="rarity-card epic">
                    <h3>EPIC</h3>
                    <span>0%</span>
                </div>

                <div class="rarity-card legendary">
                    <h3>LEGENDARY</h3>
                    <span>0%</span>
                </div>

            </div>
<div id="collectionRewardsTab" class="collection-rewards-tab">

    <div class="collection-score-box">
        <h3>ПУТЬ НАГРАД</h3>
        <p>Нажми на доступную награду, чтобы забрать её</p>

        <div class="collection-score-value">
            Очки: <span id="collectionScoreValue">0</span>
        </div>
    </div>

<div class="reward-road-wrap">

    <div id="collectionRewardRoad"
         class="collection-reward-road">
    </div>
    <button class="reward-float-arrow reward-float-left" onclick="scrollRewardRoad(-1)">‹</button>
<button class="reward-float-arrow reward-float-right" onclick="scrollRewardRoad(1)">›</button>

</div>

</div>

        </div>

    </div>

</div>
    <script src="script.js"></script>
</body>
</html>
