<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Открытие карточных паков</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="collect-page">

<section class="collect-room">
  <div class="collect-overlay"></div>
<div class="collect-center">
<div class="collect-portal"></div>

<img id="collectPack" class="collect-pack" src="" alt="Пак" onclick="openCollectPack()">

<img id="collectDice" class="collect-dice-img" src="image/ui/collect/dice-1.png" alt="Кубик">

<div class="reward-cards" id="rewardCards"></div>

<div class="collect-controls">
  <button class="collect-roll-button" onclick="rollCollectDice()">
    <img src="image/ui/collect/btn-roll (1).png" alt="">
  </button>
</div>



<button class="collect-new-take-btn" id="collectTakeBtn" onclick="collectRewards()">
  <img src="image/ui/collect/btn-take.png" alt="Собрать">
</button>

<div class="collect-top-buttons">

<button class="collect-chances-btn" onclick="openChancesModal()">
  <img src="image/ui/collect/btn-chances.png" alt="Шансы">
</button>

    <div class="collect-energy-box">
        <img src="image/ui/collect/btn-energy.png" alt="Энергия">

<div class="collect-energy-value">
    <span id="collectEnergyValue">100</span>/<span id="collectEnergyMax">100</span>
</div>
    </div>

</div>

<nav class="collect-side-menu">

<a href="index.html">
<img src="image/ui/collect/btn-home.png">
</a>

<a href="#">
<img src="image/ui/collect/btn-collection.png">
</a>

<a href="#">
<img src="image/ui/collect/btn-quests.png">
</a>

<a href="#">
<img src="image/ui/collect/btn-shop.png">
</a>

</nav>
</div>
</section>
<div class="collect-result-modal" id="collectResultModal">
  <div class="collect-result-window">
    <img class="collect-result-bg" src="image/ui/collect/result-panel.png" alt="Итог">

    <div class="collect-result-cards" id="collectResultCards"></div>

    <div class="collect-result-total">
      +<span id="collectResultTotal">0</span>
    </div>

    <div class="collect-result-list">
      <div>COMMON <span id="resultCommon">+0</span></div>
      <div>RARE <span id="resultRare">+0</span></div>
      <div>EPIC <span id="resultEpic">+0</span></div>
      <div>LEGENDARY <span id="resultLegendary">+0</span></div>
    </div>

    <div class="collect-result-actions">
      <button onclick="openAgainCollect()">
        <img src="image/ui/collect/btn-open-again.png" alt="Открыть ещё">
      </button>

      <button onclick="closeCollectResult()">
        <img src="image/ui/collect/btn-continue.png" alt="Продолжить">
      </button>
    </div>
  </div>
</div>

<div class="collect-chances-modal" id="collectChancesModal" onclick="closeChancesModal()">
  <img src="image/ui/collect/chances-panel.png" alt="Шансы">
</div>
  <script src="script.js"></script>
</body>
</html>
