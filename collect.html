<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Открытие карточных паков</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="collect-page">

<section class="collect-room">
  <div class="collect-overlay"></div>
<div class="collect-center">
<div class="collect-portal"></div>

<img id="collectPack" class="collect-pack" src="" alt="Пак" onclick="openCollectPack()">

<img id="collectDice" class="collect-dice-img" src="image/ui/collect/dice-1.png" alt="Кубик">

<div class="reward-cards" id="rewardCards"></div>

<div class="collect-controls">
  <button class="collect-roll-button" onclick="rollCollectDice()">
    <img src="image/ui/collect/btn-roll (1).png" alt="">
  </button>
</div>



<button class="collect-new-take-btn" id="collectTakeBtn" onclick="collectRewards()">
  <img src="image/ui/collect/btn-collect.png" alt="Собрать">
</button>

<button class="collect-chances-btn">
  ШАНСЫ
</button>

<div class="collect-energy-box">
  ⚡ <span id="collectEnergyValue">100</span>
</div>

<nav class="collect-side-menu">
  <a href="index.html">
    <img src="image/ui/collect/btn-home.png" alt="Главная">
  </a>

  <a href="index.html#collection">
    <img src="image/ui/collect/btn-collection.png" alt="Коллекции">
  </a>

  <a href="index.html#quests">
    <img src="image/ui/collect/btn-quests.png" alt="Задания">
  </a>

  <a href="index.html#shop">
    <img src="image/ui/collect/btn-shop.png" alt="Магазин">
  </a>
</nav>
</div>
</section>

  <script src="script.js"></script>
</body>
</html>
