<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Открытие карточных паков</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="collect-page">

  <section class="collect-room">
    <div class="collect-overlay"></div>

    <div class="collect-top">
      <button class="collect-back" onclick="goHome()">← Назад</button>

      <div class="collect-title">
        <h1 id="collectThemeTitle">MEME COLLECTION CLUB</h1>
        <p>Открывай паки и собирай карточки</p>
      </div>
    </div>

    <div class="collect-center">
      <div class="collect-portal"></div>

      <button class="collect-roll-btn">
        🎲 Бросить кубик
        <span>-10 энергии</span>
      </button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
